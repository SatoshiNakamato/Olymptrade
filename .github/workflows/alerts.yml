name: Market signal email alerts
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send a test email instead of scanning markets"
        required: false
        type: boolean
        default: false
      run_pipeline_tests_only:
        description: "Run automated tests only; do not send email or scan markets"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: market-alerts
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Restore alert cooldown state
        uses: actions/cache/restore@v4
        with:
          path: .signal_state.json
          key: signal-state-${{ github.run_id }}
          restore-keys: signal-state-
      - name: Restore Strategy 2 alert state
        uses: actions/cache/restore@v4
        with:
          path: .strategy2_state.json
          key: strategy2-state-${{ github.run_id }}
          restore-keys: strategy2-state-
      - name: Restore cross-strategy duplicate-alert state
        id: restore-global-alert-state
        uses: actions/cache/restore@v4
        with:
          path: .global_alert_state.json
          key: global-alert-state-${{ github.run_id }}
          restore-keys: global-alert-state-
      - name: Initialize cross-strategy alert state
        run: test -f .global_alert_state.json || printf '{}\n' > .global_alert_state.json
      - name: Verify shared deduplication cache restore
        run: |
          if [ "${{ steps.restore-global-alert-state.outputs.cache-hit }}" = "true" ]; then
            echo "PASS: previous cross-strategy alert state restored from cache."
          else
            echo "INFO: no prior cross-strategy cache found (expected on first run)."
          fi
      - name: Restore USD calendar cache
        uses: actions/cache/restore@v4
        with:
          path: .usd_calendar_cache.json
          key: usd-calendar-${{ github.run_id }}
          restore-keys: usd-calendar-
      - name: Restore Strategy 3 alert state
        uses: actions/cache/restore@v4
        with:
          path: .strategy3_state.json
          key: strategy3-state-${{ github.run_id }}
          restore-keys: strategy3-state-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Test pandas-free trade sizing suggestions
        run: python -m unittest -v test_trade_advisor.py
      - name: Test cross-strategy alert deduplication
        run: python -m unittest -v test_alert_dedupe.py
      - name: Test email formatting and mocked SMTP delivery
        run: python -m unittest -v test_email_alerts.py
      - name: Test completed-candle plan monitoring
        run: python -m unittest -v test_plan_monitor.py
      - name: Test mocked TP1 and exit notification emails
        run: python -m unittest -v test_plan_alert_emails.py
      - name: Test retry-safe plan notification delivery
        run: python -m unittest -v test_plan_notifications.py
      - name: Test end-to-end BUY/SELL, TP1 and TP2 email pipeline
        run: python -m unittest -v test_alert_pipeline_e2e.py
      - name: Validate Gmail configuration
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_pipeline_tests_only && !inputs.send_test_email }}
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import sys

          missing = [
              name for name in ("GMAIL_SENDER", "GMAIL_APP_PASSWORD")
              if not os.environ.get(name, "").strip()
          ]
          if missing:
              print("::error::Missing GitHub Actions secrets: " + ", ".join(missing))
              sys.exit(1)
          if "@" not in os.environ["GMAIL_SENDER"]:
              print("::error::GMAIL_SENDER must be a Gmail address.")
              sys.exit(1)
          print("Gmail credentials are present. Secret values were not displayed.")
          PY
      - name: Send test email
        if: github.event_name == 'workflow_dispatch' && inputs.send_test_email && !inputs.run_pipeline_tests_only
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: Ineed2pnaga@gmail.com
        run: python send_test_email.py
      - name: Scan markets and email confirmed signals
        id: strategy1_scan
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.run_pipeline_tests_only && !inputs.send_test_email) }}
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: Ineed2pnaga@gmail.com
          SYMBOLS: EUR/USD,GBP/USD,USD/JPY,AUD/USD,XAU/USD,XAG/USD,BTC/USD,US500
        run: python main.py
      - name: Scan markets with Strategy 2 and email confirmed signals
        id: strategy2_scan
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.run_pipeline_tests_only && !inputs.send_test_email) }}
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: Ineed2pnaga@gmail.com
          SYMBOLS: EUR/USD,GBP/USD,USD/JPY,AUD/USD,XAU/USD,XAG/USD,BTC/USD,US500
        run: python strategy2.py
      - name: Scan eight shared markets with Strategy 3 and email confirmed signals
        id: strategy3_scan
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.run_pipeline_tests_only && !inputs.send_test_email) }}
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: Ineed2pnaga@gmail.com
          SYMBOLS: EUR/USD,GBP/USD,USD/JPY,AUD/USD,XAU/USD,XAG/USD,BTC/USD,US500
        run: python strategy3.py
      - name: Report scanner failures after all strategies have run
        if: always()
        env:
          STRATEGY1_OUTCOME: ${{ steps.strategy1_scan.outcome }}
          STRATEGY2_OUTCOME: ${{ steps.strategy2_scan.outcome }}
          STRATEGY3_OUTCOME: ${{ steps.strategy3_scan.outcome }}
        run: |
          failed=0
          for item in "Strategy 1:$STRATEGY1_OUTCOME" "Strategy 2:$STRATEGY2_OUTCOME" "Strategy 3:$STRATEGY3_OUTCOME"; do
            name="${item%%:*}"
            outcome="${item#*:}"
            echo "$name scan outcome: $outcome"
            if [ "$outcome" = "failure" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more strategy scanners failed. See the individual scanner logs."
            exit 1
          fi
      - name: Save cross-strategy duplicate-alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .global_alert_state.json
          key: global-alert-state-${{ github.run_id }}
      - name: Save USD calendar cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .usd_calendar_cache.json
          key: usd-calendar-${{ github.run_id }}
      - name: Save Strategy 3 alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .strategy3_state.json
          key: strategy3-state-${{ github.run_id }}
      - name: Save Strategy 2 alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .strategy2_state.json
          key: strategy2-state-${{ github.run_id }}
      - name: Save alert cooldown state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .signal_state.json
          key: signal-state-${{ github.run_id }}
